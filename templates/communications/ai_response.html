{% extends "base.html" %}
{% block title %}Respostas com IA — ComunicaSaaS{% endblock %}
{% block content %}
<div class="container"><div class="row justify-content-center"><div class="col-md-8">
    <h2 class="mb-4"><i class="bi bi-robot me-2"></i>Respostas Automáticas com IA</h2>
    <div class="card shadow-sm mb-4"><div class="card-body p-4">
        <form method="post">{% csrf_token %}
            <div class="mb-3"><label class="form-label">Mensagem do cliente</label>{{ form.prompt }}</div>
            <div class="mb-3"><label class="form-label">Contexto adicional (opcional)</label>{{ form.context }}</div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-magic me-1"></i>Gerar Resposta</button>
        </form>
    </div></div>
    {% if response_text %}
    <div class="card shadow-sm border-success"><div class="card-header bg-success text-white"><i class="bi bi-robot me-2"></i>Resposta Gerada</div>
        <div class="card-body"><p class="mb-0">{{ response_text }}</p></div>
        <div class="card-footer"><button class="btn btn-sm btn-outline-primary" onclick="navigator.clipboard.writeText(document.querySelector('.card-body p').textContent)"><i class="bi bi-clipboard me-1"></i>Copiar</button></div>
    </div>
    {% endif %}
</div></div></div>
{% endblock %}
