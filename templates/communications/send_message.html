{% extends "base.html" %}
{% block title %}Enviar Mensagem — ComunicaSaaS{% endblock %}
{% block content %}
<div class="container"><div class="row justify-content-center"><div class="col-md-8">
    <h2 class="mb-4"><i class="bi bi-chat me-2"></i>Enviar Mensagem para {{ client.name }}</h2>
    <div class="card shadow-sm"><div class="card-body p-4">
        <form method="post">{% csrf_token %}
            {{ form.client }}
            <div class="mb-3"><label class="form-label">Canal</label>{{ form.channel }}</div>
            <div class="mb-3"><label class="form-label">Template (opcional)</label>{{ form.template }}</div>
            <div class="mb-3"><label class="form-label">Assunto (para e-mail)</label>{{ form.subject }}</div>
            <div class="mb-3"><label class="form-label">Mensagem</label>{{ form.message }}</div>
            <div class="d-flex gap-2"><button type="submit" class="btn btn-success"><i class="bi bi-send me-1"></i>Enviar</button><a href="{% url 'clients:client_detail' client.pk %}" class="btn btn-outline-secondary">Cancelar</a></div>
        </form>
    </div></div>
</div></div></div>
{% endblock %}
