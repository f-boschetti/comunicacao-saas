{% extends "base.html" %}
{% block title %}Registrar Interação — ComunicaSaaS{% endblock %}
{% block content %}
<div class="container"><div class="row justify-content-center"><div class="col-md-8">
    <h2 class="mb-4"><i class="bi bi-chat-left-text me-2"></i>{{ title }}</h2>
    <div class="card shadow-sm"><div class="card-body p-4">
        <form method="post">{% csrf_token %}
            {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small class="text-danger d-block">{{ error }}</small>{% endfor %}</div>{% endfor %}
            <div class="d-flex gap-2"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Registrar</button><a href="{% url 'communications:interaction_list' %}" class="btn btn-outline-secondary">Cancelar</a></div>
        </form>
    </div></div>
</div></div></div>
{% endblock %}
