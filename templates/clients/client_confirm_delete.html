{% extends "base.html" %}
{% block title %}Excluir Cliente — ComunicaSaaS{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                    <h4 class="mt-3">Confirmar exclusão</h4>
                    <p>Tem certeza que deseja excluir o cliente <strong>{{ client.name }}</strong>?</p>
                    <p class="text-muted">Esta ação não pode ser desfeita.</p>
                    <form method="post">
                        {% csrf_token %}
                        <a href="{% url 'clients:client_detail' client.pk %}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Excluir</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
