{% extends "base.html" %}
{% block title %}Meu Perfil — ComunicaSaaS{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4"><i class="bi bi-person me-2"></i>Meu Perfil</h2>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            {% for field in form %}
                            <div class="col-md-6 mb-3">
                                <label class="form-label">{{ field.label }}</label>
                                {{ field }}
                                {% for error in field.errors %}<small class="text-danger">{{ error }}</small>{% endfor %}
                            </div>
                            {% endfor %}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Perfil de acesso</label>
                            <input type="text" class="form-control" value="{{ user.get_role_display }}" disabled>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
