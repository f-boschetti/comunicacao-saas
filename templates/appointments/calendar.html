{% extends "base.html" %}
{% block title %}Calendário — ComunicaSaaS{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-calendar3 me-2"></i>Calendário</h2>
        <a href="{% url 'appointments:appointment_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo Agendamento</a>
    </div>
    <div class="card shadow-sm"><div class="card-body"><div id="calendar"></div></div></div>
</div>
{% endblock %}
{% block extra_css %}<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">{% endblock %}
{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var events = {{ events_json|safe }};
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth', locale: 'pt-br',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
        events: events,
        eventClick: function(info) { window.location.href = '/appointments/' + info.event.id + '/'; },
        eventColor: '#0d6efd',
    });
    calendar.render();
});
</script>
{% endblock %}
